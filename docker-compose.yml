version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-local
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
      MYSQL_USER: sid
      MYSQL_PASSWORD: sidpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql        # persist data across restarts

volumes:
  mysql_data:
